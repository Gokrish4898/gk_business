<div class="container pt-3 pb-5">
  
  <div class="carousel-container mb-4" *ngIf="slides && slides.length > 0">
    <ngb-carousel [interval]="3000" [pauseOnHover]="true" [showNavigationArrows]="true">
      <ng-template ngbSlide *ngFor="let slide of slides; let i = index" [id]="'slide-' + i">
        <div class="picsum-img-wrapper">
          <img [src]="slide.url" [alt]="slide.title" class="slide-image w-100" style="object-fit: cover; border-radius: 12px; height: 300px;" />
        </div>
        <div class="carousel-caption">
          <h3>{{ slide.title }}</h3>
          <p>{{ slide.description }}</p>
        </div>
      </ng-template>
    </ngb-carousel>
  </div>

  <div class="product_box bg-white p-4 rounded shadow-sm">
    
    <div class="product-header-area">
      <h3 class="sub-header m-0">Our Products</h3>
      
      <div class="horizontal-filters">
        <label class="filter-chip">
          <input type="checkbox" id="hot">
          <span>Hot Selling</span>
        </label>
        <label class="filter-chip">
          <input type="checkbox" id="ordered">
          <span>Most Ordered</span>
        </label>
        <label class="filter-chip">
          <input type="checkbox" id="low">
          <span>Price: Low to High</span>
        </label>
        <label class="filter-chip">
          <input type="checkbox" id="high">
          <span>Price: High to Low</span>
        </label>
      </div>
    </div>
    
    <hr class="thick-separator mb-4">

    <div class="modern-product-grid">
      
      <div class="product-card" *ngFor="let item of product">
        <div class="img-wrapper">
          <img [src]="item.image" alt="Product Image" class="card-image">
        </div>
        <h4 class="product-title mt-2">{{item.title}}</h4>
        
        <div class="card-footer-row d-flex justify-content-between align-items-center mt-3">
          <div class="rating-box">
            <i class="bi bi-star-fill text-warning"></i>
            <span class="rating-text ms-1">{{item.rating}} ({{item.totalrating}})</span>
          </div>
          
          <div class="wishlist-icon">
            @if (item.wishlist == 1) {
              <i class="bi bi-heart-fill text-danger fs-5"></i>
            } @else {
              <i class="bi bi-heart fs-5"></i>
            }
          </div>
        </div>
      </div>

    </div>

    <div class="paginator-wrapper mt-4 d-flex justify-content-center border-top pt-3">
      <mat-paginator [length]="product.length"
                     [pageSize]="10"
                     [pageSizeOptions]="[5, 10, 25, 100]"
                     aria-label="Select page">
      </mat-paginator>
    </div>

  </div>
</div>
