<div class="profile-page">
  <div class="profile-card fade-in-up">
    
    <div class="profile-header text-center mb-4">
      <div class="avatar-large mb-3">
        <i class="bi bi-person-fill"></i>
        @if (viewMode === 'edit') {
          <button class="avatar-edit-btn" title="Change Photo">
            <i class="bi bi-camera-fill"></i>
          </button>
        }
      </div>
      <h2 class="brand-title">{{ user.name }}</h2>
      <p class="text-muted">{{ user.email }}</p>
    </div>

    @switch (viewMode) {
      
      @case ('view') {
        <div class="info-grid fade-in">
          <div class="info-group">
            <label>Full Name</label>
            <p>{{ user.name }}</p>
          </div>
          <div class="info-group">
            <label>Phone Number</label>
            <p>{{ user.phone }}</p>
          </div>
          <div class="info-group full-width">
            <label>Delivery Address</label>
            <p>{{ user.address }}</p>
          </div>
        </div>

        <div class="action-buttons mt-4">
          <button class="btn custom-btn outline full-width" (click)="toggleMode('edit')">
            <i class="bi bi-pencil-square"></i> Edit Profile
          </button>
          <button class="btn btn-link text-muted full-width mt-2" (click)="toggleMode('password')">
            Change / Reset Password
          </button>
        </div>
      }

      @case ('edit') {
        <form class="fade-in">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control custom-input" [(ngModel)]="editUser.name" name="name">
          </div>
          
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control custom-input" [(ngModel)]="editUser.phone" name="phone">
          </div>

          <div class="mb-4">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-control custom-input" rows="2" [(ngModel)]="editUser.address" name="address"></textarea>
          </div>

          <div class="action-buttons split-buttons">
            <button type="button" class="btn custom-btn outline" (click)="toggleMode('view')">Cancel</button>
            <button type="button" class="btn custom-btn success" (click)="saveProfile()">Save Changes</button>
          </div>
        </form>
      }

      @case ('password') {
        <form class="fade-in">
          <div class="alert-box mb-4">
            <i class="bi bi-shield-lock-fill"></i> Secure Password Reset
          </div>

          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-control custom-input" placeholder="••••••••" [(ngModel)]="oldPassword" name="oldPass">
            <small class="text-right d-block mt-1"><a href="#" class="gold-link">Forgot it? Send OTP</a></small>
          </div>
          
          <div class="mb-4">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control custom-input" placeholder="Enter new password" [(ngModel)]="newPassword" name="newPass">
          </div>

          <div class="action-buttons split-buttons">
            <button type="button" class="btn custom-btn outline" (click)="toggleMode('view')">Cancel</button>
            <button type="button" class="btn custom-btn" (click)="updatePassword()" [disabled]="!newPassword">Update Password</button>
          </div>
        </form>
      }
    }
  </div>
</div>
