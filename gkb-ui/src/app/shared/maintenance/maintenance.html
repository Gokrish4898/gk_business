      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
        <defs>
          <style>
            /* Base Line Art Styles */
            .line {
              fill: none;
              stroke: #ffffff;
              stroke-width: 4;
              stroke-linecap: round;
              stroke-linejoin: round;
            }
            .muted {
              stroke: #86868b;
            }
            .gold {
              stroke: #d4a373;
            }
            .red {
              stroke: #e74c3c;
            }

            /* Animation Assignments */
            .typing {
              animation: type 4s infinite;
              transform-origin: 70px 100px;
            }
            .head {
              animation: worry 4s infinite;
              transform-origin: 70px 90px;
            }
            .cable-good {
              animation: snap 4s infinite;
            }
            .cable-bad {
              opacity: 0;
              animation: show-snap 4s infinite;
            }
            .spark {
              opacity: 0;
              animation: spark-flash 4s infinite;
              transform-origin: 120px 170px;
            }
            .alert {
              opacity: 0;
              animation: alert-pop 4s infinite;
              transform-origin: 70px 40px;
            }
            .screen {
              animation: screen-die 4s infinite;
            }

            /* 1. The Typing Animation (Hands bobbing up and down) */
            @keyframes type {
              0%,
              40% {
                transform: rotate(0deg);
              }
              5%,
              15%,
              25%,
              35% {
                transform: rotate(5deg);
              }
              10%,
              20%,
              30% {
                transform: rotate(-5deg);
              }
              45%,
              100% {
                transform: rotate(15deg) translateY(5px);
              } /* Hands drop in defeat */
            }

            /* 2. The Worry Animation (Head droops down) */
            @keyframes worry {
              0%,
              44% {
                transform: rotate(0deg);
              }
              48%,
              90% {
                transform: rotate(-15deg) translateY(8px);
              }
              100% {
                transform: rotate(0deg);
              }
            }

            /* 3. The Cable Breaking */
            @keyframes snap {
              0%,
              44% {
                opacity: 1;
              }
              45%,
              100% {
                opacity: 0;
              }
            }
            @keyframes show-snap {
              0%,
              44% {
                opacity: 0;
              }
              45%,
              100% {
                opacity: 1;
              }
            }

            /* 4. The Snapping Spark */
            @keyframes spark-flash {
              0%,
              44% {
                opacity: 0;
                transform: scale(0.5);
              }
              45% {
                opacity: 1;
                transform: scale(1.2);
              }
              50%,
              100% {
                opacity: 0;
                transform: scale(1.5);
              }
            }

            /* 5. The Alert Popup */
            @keyframes alert-pop {
              0%,
              45% {
                opacity: 0;
                transform: scale(0.5);
              }
              50%,
              90% {
                opacity: 1;
                transform: scale(1);
              }
              100% {
                opacity: 0;
              }
            }

            /* 6. The Screen Dying */
            @keyframes screen-die {
              0%,
              44% {
                fill: rgba(212, 163, 115, 0.15);
                stroke: #d4a373;
              }
              45%,
              100% {
                fill: rgba(231, 76, 60, 0.05);
                stroke: #86868b;
              }
            }
          </style>
        </defs>

        <line class="line muted" x1="20" y1="140" x2="220" y2="140" />

        <line class="line muted" x1="160" y1="140" x2="160" y2="120" />
        <line class="line muted" x1="140" y1="140" x2="180" y2="140" />
        <rect class="line screen" x="120" y="60" width="80" height="60" rx="6" />

        <line class="line screen" x1="135" y1="80" x2="185" y2="80" stroke-width="2" />
        <line class="line screen" x1="135" y1="95" x2="165" y2="95" stroke-width="2" />

        <path class="line gold cable-good" d="M160,120 L160,170 L50,170" />

        <g class="cable-bad">
          <path class="line muted" d="M160,120 L160,170 L130,170" />
          <path class="line muted" d="M110,176 L50,176" />
        </g>

        <g class="spark">
          <line class="line red" x1="120" y1="160" x2="125" y2="150" stroke-width="2" />
          <line class="line red" x1="115" y1="165" x2="105" y2="160" stroke-width="2" />
          <line class="line red" x1="125" y1="175" x2="135" y2="180" stroke-width="2" />
        </g>

        <g class="head">
          <g class="alert">
            <circle cx="70" cy="20" r="3" fill="#e74c3c" />
            <line class="line red" x1="70" y1="28" x2="70" y2="40" stroke-width="4" />
          </g>
          <circle class="line" cx="70" cy="70" r="16" />
        </g>

        <path class="line" d="M54,140 C54,105 86,105 86,140" />

        <path class="line typing" d="M70,110 L100,125 L115,120" />
      </svg>
    </div>

    <h1 class="m-title">Baking Something New</h1>
    <h3 class="m-subtitle">System Upgrade</h3>

    <div class="divider"></div>

    <p class="m-description">
      Our kitchen is currently closed for scheduled upgrades to bring you an even better experience.
      We are fine-tuning our optics and preheating the ovens.
    </p>

    <div class="status-pill">
      <span class="pulse-dot"></span>
      <span>Estimated Return: Shortly</span>
    </div>
  </div>
